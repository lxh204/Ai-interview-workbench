name: ai-interview-workbench

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_workbench
      POSTGRES_USER: ${WORKBENCH_DB_USERNAME:-interview_workbench}
      POSTGRES_PASSWORD: ${WORKBENCH_DB_PASSWORD:?Set WORKBENCH_DB_PASSWORD}
    ports:
      - "127.0.0.1:${WORKBENCH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${WORKBENCH_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  redis_data:
