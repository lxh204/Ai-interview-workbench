server:
  address: ${WORKBENCH_HOST:127.0.0.1}
  port: ${WORKBENCH_PORT:8092}
spring:
  application:
    name: interview-workbench
  datasource:
    url: ${WORKBENCH_DB_URL:jdbc:postgresql://127.0.0.1:5432/interview_workbench}
    username: ${WORKBENCH_DB_USERNAME:interview_workbench}
    password: ${WORKBENCH_DB_PASSWORD:}
  data:
    redis:
      host: ${WORKBENCH_REDIS_HOST:127.0.0.1}
      port: ${WORKBENCH_REDIS_PORT:6379}
      password: ${WORKBENCH_REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 5s
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:interview-schema.sql,classpath:knowledge-parity-schema.sql,classpath:knowledge-postgres.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
workbench:
  resume:
    queue: redis
    stream: ${WORKBENCH_RESUME_STREAM:interview-workbench:resume-reviews}
  model:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    chat: ${AI_CHAT_MODEL:}
    embedding: ${AI_EMBEDDING_MODEL:}
